<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Face Emotion Detection</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>





<div class="container">

<div class="logo">
<h1>Face Emotion Detection</h1>

</div>

<div class="tabs">
<button id="loginTab" class="active">Login</button>
<button id="registerTab">Register</button>
</div>

<!-- LOGIN -->

<div class="form-container" id="loginForm">

<form action="/login_user" method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<div class="password-box">
<input type="password"
id="loginPassword"
name="password"
placeholder="Password"
required>

<span onclick="togglePassword('loginPassword')">
👁
</span>
</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

</form>

</div>

<!-- REGISTER -->

<div class="form-container hidden" id="registerForm">

<form action="/register_user" method="POST">

<input type="text"
name="fullname"
placeholder="Full Name"
required>

<input type="text"
name="username"
placeholder="Username"
required>

<input type="email"
name="email"
placeholder="Email"
required>

<div class="password-box">
<input type="password"
id="registerPassword"
name="password"
placeholder="Password"
required>

<span onclick="togglePassword('registerPassword')">
👁
</span>
</div>


<div class="password-box">

<input type="password"
id="confirmPassword"
name="confirm_password"
placeholder="Confirm Password"
required>

<span onclick="togglePassword('confirmPassword')">
👁
</span>

</div>


<label class="terms">
<input type="checkbox" required>
I Agree Terms & Conditions
</label>

<button type="submit">
Create Account
</button>

</form>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<div class="cursor-glow"></div>
</body>
</html>
